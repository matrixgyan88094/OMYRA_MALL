    <script>
      // Gracefully ignore benign Vite WebSocket connection errors in sandboxed iframes
      window.addEventListener('error', function(e) {
        if (e.message && (e.message.includes('WebSocket') || e.message.includes('@vite/client') || e.message.includes('createWebSocketModuleRunnerTransport'))) {
          e.stopImmediatePropagation();
        }
      }, true);
      window.addEventListener('unhandledrejection', function(e) {
        var reason = e.reason ? String(e.reason.message || e.reason) : '';
        if (reason.includes('WebSocket') || reason.includes('@vite/client') || reason.includes('createWebSocketModuleRunnerTransport')) {
          e.stopImmediatePropagation();
        }
      }, true);
    </script>
